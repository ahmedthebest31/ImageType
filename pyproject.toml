[project]
name = "ImageType"
version = "3.0.0"
description = "An application for adding text to images, with support for templates and multiple languages."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "arabic-reshaper",
    "pillow",
    "pyside6",
    "requests",
    "python-bidi",
    "qtawesome",
]

[project.gui-scripts]
imagetype = "main:main"

[dependency-groups]
dev = [
    "pyinstaller",
]